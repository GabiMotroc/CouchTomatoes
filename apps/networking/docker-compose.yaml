x-service: &service
  restart: unless-stopped
  networks:
    - media_network

x-user: &user
  <<: *service
  environment:
    - PUID=${USER_ID}
    - PGID=${GROUP_ID}
    - TZ=${TIMEZONE}

services:
  adguard:
    <<: *service
    image: adguard/adguardhome:latest
    container_name: ${ADGUARD_NAME}
    ports:
      - 53:53/tcp
      - 53:53/udp
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "https://${ADGUARD_NAME}.${DOMAIN}/"]
      interval: 30s
      retries: 10

  traefik:
    <<: *service
    image: traefik:latest
    container_name: traefik
    env_file:
      - .env
    ports:
      - 80:80
      - 443:443
      - 8010:8080
      - 8443:8443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik
      - ./acme/acme.json:/acme.json

